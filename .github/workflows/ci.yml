name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Run fixture tests and publish unsigned app
        shell: pwsh
        run: ./build.ps1
      - name: Upload unsigned build for review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ChilePrimeRepair-unsigned
          path: artifacts/unsigned/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fixture-test-results
          path: |
            artifacts/test-results/core-tests.txt
            artifacts/test-results/ui-*/*.txt
            artifacts/test-results/ui-*/*.png
          if-no-files-found: warn
          retention-days: 30
